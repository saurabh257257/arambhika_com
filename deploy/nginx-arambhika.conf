# Production nginx for the live droplet (/etc/nginx/sites-enabled/arambhika).
# www.arambhika.com is the only real site; the retired arambhikaenablers.in names only redirect to it.
# TLS lines mirror what certbot manages; the certificate must keep covering the old names so
# https://arambhikaenablers.in still redirects instead of showing a certificate warning.

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.arambhika.com 168.144.223.118;

    ssl_certificate /etc/letsencrypt/live/www.arambhika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arambhika.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Retired domain: permanent redirect to the same path on the real site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arambhikaenablers.in www.arambhikaenablers.in;

    ssl_certificate /etc/letsencrypt/live/www.arambhika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arambhika.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.arambhika.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name arambhika.com www.arambhika.com arambhikaenablers.in www.arambhikaenablers.in;
    return 301 https://www.arambhika.com$request_uri;
}
