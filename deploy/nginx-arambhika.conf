# Production nginx for the live droplet (/etc/nginx/sites-enabled/arambhika).
# www.arambhika.com is the only real site; the retired arambhikaenablers.in names only show a notice page.
# TLS lines mirror what certbot manages; the certificate must keep covering the old names so
# https://arambhikaenablers.in still shows the notice page instead of a certificate warning.

server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name www.arambhika.com 168.144.223.118;

    ssl_certificate /etc/letsencrypt/live/www.arambhika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arambhika.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Retired domain: every address shows one static "we have moved, please visit www.arambhika.com"
# page. /var/www/old-domain/index.html is deploy/old-domain/index.html.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arambhikaenablers.in www.arambhikaenablers.in;

    ssl_certificate /etc/letsencrypt/live/www.arambhika.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arambhika.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/old-domain;
    location / {
        try_files /index.html =404;
    }
}

# Plain http for either site: go to https on the real address (the old names show the notice page
# over https first, then the visitor chooses to continue).
server {
    listen 80;
    listen [::]:80;
    server_name arambhikaenablers.in www.arambhikaenablers.in;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name arambhika.com www.arambhika.com;
    return 301 https://www.arambhika.com$request_uri;
}
