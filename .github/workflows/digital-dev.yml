name: digital-content (dev only)

# The Digital Content tool is a separate service. It is tested and deployed only to the DEV
# droplet (https://digital.arambhika.com) and never to production: there is no production job.
# Nothing in apps/digital-content is part of the website release either (deploy.sh skips apps/).

on:
  push:
    branches: [dev]
    paths:
      - 'apps/digital-content/**'
      - 'scripts/deploy-digital.sh'
      - '.github/workflows/digital-dev.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'apps/digital-content/**'
  workflow_dispatch:

concurrency:
  group: digital-content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: digital content tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/digital-content
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/digital-content/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: deploy to dev droplet
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        run: bash scripts/deploy-digital.sh
        env:
          DEPLOY_ENV: dev
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DIGITAL_PORT: ${{ vars.DIGITAL_PORT }}
          PUBLIC_BASE_URL: ${{ vars.DIGITAL_PUBLIC_BASE_URL }}
          # credentials, kept only as environment secrets
          ADMIN_PASSWORD: ${{ secrets.DIGITAL_ADMIN_PASSWORD }}
          BYTEPLUS_API_KEY: ${{ secrets.DIGITAL_BYTEPLUS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.DIGITAL_ANTHROPIC_API_KEY }}
          SESSION_SECRET: ${{ secrets.DIGITAL_SESSION_SECRET }}
